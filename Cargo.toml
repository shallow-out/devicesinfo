[workspace]
resolver = "3"
members = [
    "crates/deviceinfo",
    "crates/deviceinfo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/shallow-out/devicesinfo"

[workspace.dependencies]
deviceinfo = { path = "crates/deviceinfo" }

clap = { version = "4", features = ["derive"] }
# 只为了 statvfs：标准库至今没有 std::fs::statvfs，而拿 `df` 子进程去解析输出
# 比这个薄封装差（多一个外部依赖 + 要处理各发行版的 df 方言）。
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
